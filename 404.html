<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · FPR Asesores Consultores</title>
<link rel="icon" href="/fpr-asesores-badajoz-web/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/fpr-asesores-badajoz-web/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
  /* rutas absolutas: GitHub Pages sirve el 404 desde cualquier profundidad */
  :root { --verde: #425448; --rotulo: #1F3D36; --hueso: #F3F1EA; --tinta: #17201C; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--hueso); color: var(--tinta); font: 400 1rem/1.6 'Hanken Grotesk', system-ui, sans-serif; padding: 2rem 1.25rem; text-align: center; }
  main { max-width: 34rem; display: grid; justify-items: center; }
  /* las tres placas… y la del medio se ha caído */
  .placas { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-bottom: 2rem; }
  .placas i { display: block; width: 44px; height: 92px; background: var(--verde); }
  .placas i:nth-child(2) { height: 44px; width: 92px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--verde); }
  p.codigo { margin: 0 0 .6rem; font: 600 .74rem/1 'Bodoni Moda', serif; letter-spacing: .3em; text-transform: uppercase; color: var(--verde); }
  h1 { margin: 0 0 1rem; font: 400 clamp(2.2rem, 7vw, 3.4rem)/1.05 'Bodoni Moda', Didot, serif; }
  h1 em { color: var(--verde); }
  p { color: #4A514D; margin: 0 0 2rem; }
  a.boton { display: inline-block; padding: 1rem 1.6rem; background: var(--verde); color: #fff; font-weight: 600; text-decoration: none; }
  a.boton:hover { background: var(--rotulo); }
  a:focus-visible { outline: 2px solid var(--verde); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="placas" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="codigo">Error 404</p>
  <h1>Aquí falta <em>una placa.</em></h1>
  <p>La página que busca no existe o ha cambiado de sitio. Todo lo demás sigue en la portada.</p>
  <a class="boton" href="/fpr-asesores-badajoz-web/">Volver al inicio</a>
</main>
</body>
</html>
